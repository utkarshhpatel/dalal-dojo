services:
  - type: web
    name: dalal-dojo-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://dalaldojo.vercel.app
      - key: DB_PATH
        value: /var/data/dalaldojo.db
      - key: DATABASE_PATH
        value: /var/data/dalaldojo.db
      - key: COOKIE_SAME_SITE
        value: none
    disk:
      name: dalaldojo-db-data
      mountPath: /var/data
      sizeGB: 1
